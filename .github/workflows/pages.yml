name: Deploy browser demo

on:
  push:
    branches: [main]
    paths: ["demo/**", "tinygpt_checkpoint.pt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export checkpoint to ONNX
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install onnx==1.17.0 onnxruntime==1.20.1 numpy
          python demo/export_onnx.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
